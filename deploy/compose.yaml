name: catchup
services:
  app:
    build:
      context: ..
    environment:
      TRACKER_DB: /data/tracker.sqlite3
      TRACKER_AUTH_REQUIRED: "1"
      TRACKER_ORIGIN: https://${TRACKER_DOMAIN:?Set TRACKER_DOMAIN in deploy/.env}
      TRACKER_SIGNUP_CODE: ${TRACKER_SIGNUP_CODE:-}
      TRACKER_PUBLIC_SIGNUP: ${TRACKER_PUBLIC_SIGNUP:-0}
      TRACKER_LINK_MODEL: ${TRACKER_LINK_MODEL:-on}
      TRACKER_ANALYSIS_WORKERS: ${TRACKER_ANALYSIS_WORKERS:-2}
      TRACKER_YOUTUBE_API_KEY: ${TRACKER_YOUTUBE_API_KEY:-}
      TRACKER_GHOST_CONTENT_KEYS: ${TRACKER_GHOST_CONTENT_KEYS:-}
      TRACKER_YOUTUBE_ARCHIVE: "0"
      TRACKER_BROWSER_SOCKET: /run/tracker-browser/worker.sock
      TRACKER_OPERATOR_NAME: ${TRACKER_OPERATOR_NAME:-Trackify}
      TRACKER_PRIVACY_EMAIL: ${TRACKER_PRIVACY_EMAIL:-}
      TRACKER_SMTP_HOST: ${TRACKER_SMTP_HOST:-}
      TRACKER_SMTP_PORT: ${TRACKER_SMTP_PORT:-587}
      TRACKER_SMTP_TLS: ${TRACKER_SMTP_TLS:-starttls}
      TRACKER_SMTP_FROM: ${TRACKER_SMTP_FROM:-}
      TRACKER_SMTP_USERNAME: ${TRACKER_SMTP_USERNAME:-}
      TRACKER_SMTP_PASSWORD: ${TRACKER_SMTP_PASSWORD:-}
      TRACKER_HOSTING_DESCRIPTION: ${TRACKER_HOSTING_DESCRIPTION:-The site operator's hosting provider}
      PYTHONDONTWRITEBYTECODE: "1"
      TMPDIR: /tmp
      TRACKER_HOSTS: ${TRACKER_DOMAIN},localhost,127.0.0.1
    volumes:
      - tracker-data:/data
      - browser-ipc:/run/tracker-browser:ro
    depends_on:
      browser:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    expose:
      - "8000"
    command: ["/app/backend/.venv/bin/uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*", "--no-access-log", "--limit-concurrency", "96", "--timeout-keep-alive", "5"]
    healthcheck:
      test: ["CMD", "/app/backend/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    logging:
      options: {max-size: "10m", max-file: "3"}
  browser:
    build:
      context: ..
      dockerfile: deploy/browser/Dockerfile
    network_mode: none
    volumes:
      - browser-ipc:/run/tracker-browser
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
    shm_size: 256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./browser/seccomp.json
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; assert pathlib.Path('/run/tracker-browser/worker.sock').is_socket()"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      options: {max-size: "10m", max-file: "2"}
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      TRACKER_DOMAIN: ${TRACKER_DOMAIN:?Set TRACKER_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      options: {max-size: "10m", max-file: "3"}
volumes:
  browser-ipc:
  tracker-data:
  caddy-data:
  caddy-config:
